name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: event-orders

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: event-orders/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:run

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: supabase/package-lock.json

      - name: Install Supabase CLI deps
        working-directory: supabase
        run: npm ci

      - name: Start local Supabase
        working-directory: supabase
        run: npx supabase start --ignore-health-check

      - name: Apply migrations
        working-directory: supabase
        run: npx supabase db reset

      - name: Stop local Supabase
        if: always()
        working-directory: supabase
        run: npx supabase stop