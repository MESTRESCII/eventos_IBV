name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: event-orders

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: event-orders/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npm run build:cf

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker separado: dispara a reconciliação de pagamentos a cada minuto.
      # O segredo RECONCILE_URL é configurado uma única vez, via wrangler secret put.
      # Roda a partir de event-orders (working-directory padrão do job) para reusar o
      # wrangler já instalado pelo npm ci — na raiz do repo não há node_modules.
      - name: Deploy reconcile cron worker
        run: npx wrangler deploy --config ../workers/reconcile-cron/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
